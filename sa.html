
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        div {
            margin: 10px;
        }

        span {
            display: inline-block;
            width: 80px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>

<body>

    <h2>Student Registration Form</h2>

    <div>
        <span>Name:</span>
        <input type="text" placeholder="Enter Name">
    </div>

    <div>
        <span>Email:</span>
        <input type="email" placeholder="Enter Email">
    </div>

    <div>
        <span>Gender:</span>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </div>

    <div>
        <span>Branch:</span>
        <select>
            <option>CSE</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>ME</option>
        </select>
    </div>

    <div>
        <button>Register</button>
    </div>

    <h3>Sample Student Data</h3>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Gender</th>
            <th>Branch</th>
        </tr>

        <tr>
            <td>Anu</td>
            <td>anu@gmail.com</td>
            <td>Female</td>
            <td>CSE</td>
        </tr>

        <tr>
            <td>Arun</td>
            <td>arun@gmail.com</td>
            <td>Male</td>
            <td>ECE</td>
        </tr>
    </table>

</body>
</html>
